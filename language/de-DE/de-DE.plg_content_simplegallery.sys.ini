PLG_CONTENT_SIMPLEGALLERY="Inhalt - Punga Simple Gallery"
PLG_CONTENT_SIMPLEGALLERY_XML_DESCRIPTION="<h3>Punga Simple Gallery</h3><p>Erzeugt Bild- und Video-Galerien aus Ordnern unterhalb des Joomla-Verzeichnisses <code>/images</code>.</p><h4>Placeholder-Syntax</h4><p><code>{simplegallery folder='pfad/zur/galerie' [columns='4'] [width='240'] [height='180'] [showcaptions='true|false'] [layout='grid|slider'] [sort='filename|date|random'] [sortorder='ascending|descending'] [media='images|videos|both'] [lightbox='builtin|external|none'] [showmetadata='true|false']}</code></p><p><code>folder</code> ist erforderlich. Alle anderen Parameter überschreiben die entsprechenden Plugin-Einstellungen. Die kanonischen Parameternamen sind <code>folder</code>, <code>columns</code>, <code>width</code>, <code>height</code>, <code>showcaptions</code>, <code>layout</code>, <code>sort</code>, <code>sortorder</code>, <code>media</code>, <code>lightbox</code> und <code>showmetadata</code>. Bei Parameternamen wird die Groß-/Kleinschreibung nicht unterschieden.</p><p>Zusätzlich akzeptiert der Placeholder-Parser folgende Schreibweisen: <code>thumb_width</code> → <code>width</code>, <code>thumb_height</code> → <code>height</code>, <code>show_captions</code> → <code>showcaptions</code>, <code>sort_order</code> → <code>sortorder</code>, <code>media_types</code> → <code>media</code>, <code>lightbox_mode</code> → <code>lightbox</code> sowie <code>show_lightbox_metadata</code> und <code>show_metadata</code> → <code>showmetadata</code>.</p><h4>Bilder und Videos</h4><p>Unterstützte Bilder: JPG/JPEG, PNG, GIF und WebP. Unterstützte Videos: MP4, M4V, WebM, OGV/OGG und MOV. Standardmäßig werden nur Bilder angezeigt. In den Plugin-Einstellungen kann auf Videos oder Bilder + Videos umgestellt werden; einzelne Galerien können dies mit <code>media='videos'</code> oder <code>media='both'</code> überschreiben.</p><h4>Video-Poster</h4><p>Ein Posterbild kann mit der JSON-Eigenschaft <code>poster</code> festgelegt werden. Ohne diese Eigenschaft sucht Punga Simple Gallery automatisch nach einer Datei im selben Ordner, die den vollständigen Videodateinamen trägt, zum Beispiel <code>garten.mp4.jpg</code>, <code>garten.mp4.png</code> oder <code>garten.mp4.webp</code>. Als Video-Poster verwendete Dateien erscheinen nicht zusätzlich als Galerieelement. Ohne Poster wird eine neutrale Videokachel dargestellt.</p><h4>Integrierte Lightbox</h4><p>Die integrierte Lightbox unterstützt Bilder und HTML5-Video, Vor/Zurück-Navigation, Pfeiltasten, Escape, Touch-/Pointer-Wischgesten, Fokusbegrenzung und das Vorladen benachbarter Bilder. In den Plugin-Einstellungen können die Lightbox-Informationen neben dem Medium, darunter oder vollständig ausgeblendet werden. Diese Position ist bewusst eine globale Darstellungsoption und hat keinen Placeholder-Parameter. <code>showmetadata='false'</code> unterdrückt nur die Metadatenzeilen einer einzelnen Galerie; Titel und Beschreibung bleiben verfügbar, sofern Lightbox-Informationen aktiviert sind.</p><h4>JSON-Metadaten</h4><p>Metadaten sind optional. Im Galerieordner kann eine <code>gallery.json</code> liegen. Der spezielle Eintrag <code>&quot;.&quot;</code> beschreibt den Ordner bzw. die Galerie; <code>author</code>, <code>copyright</code> und <code>location</code> werden von dort an die einzelnen Medien vererbt. <code>title</code> und <code>description</code> im <code>&quot;.&quot;</code>-Eintrag beschreiben dagegen die Galerie selbst und werden nicht vererbt.</p><pre><code>{<br>  &quot;.&quot;: {<br>    &quot;title&quot;: &quot;Garten, September 2026&quot;,<br>    &quot;description&quot;: &quot;Einige Bilder und Videos aus dem Garten.&quot;,<br>    &quot;author&quot;: &quot;Beispielautor&quot;,<br>    &quot;copyright&quot;: &quot;© 2026 Beispielautor&quot;,<br>    &quot;location&quot;: &quot;Braunschweig&quot;<br>  },<br>  &quot;some_image.jpg&quot;: {<br>    &quot;title&quot;: &quot;Der Garten im September&quot;,<br>    &quot;description&quot;: &quot;Blick zum alten Kastanienbaum.&quot;,<br>    &quot;date&quot;: &quot;2026-09-18&quot;,<br>    &quot;alt&quot;: &quot;Blick durch den Garten zum Kastanienbaum&quot;<br>  },<br>  &quot;garden_walk.mp4&quot;: {<br>    &quot;title&quot;: &quot;Ein Rundgang durch den Garten&quot;,<br>    &quot;description&quot;: &quot;Ein kurzer Rundgang durch den hinteren Garten.&quot;,<br>    &quot;poster&quot;: &quot;garden_walk_poster.jpg&quot;<br>  }<br>}</code></pre><p>Unterstützte JSON-Eigenschaften eines Mediums sind <code>title</code>, <code>description</code>, <code>date</code>, <code>author</code>, <code>location</code>, <code>copyright</code>, <code>alt</code>, <code>poster</code>, <code>camera</code>, <code>lens</code>, <code>exposure</code>, <code>aperture</code>, <code>iso</code> und <code>focal_length</code>. Zusätzlich kann eine einzelne Datei eine Sidecar-Datei wie <code>some_image.jpg.json</code> oder <code>garden_walk.mp4.json</code> besitzen. Darin stehen dieselben Eigenschaften direkt, ohne zusätzlichen Wrapper.</p><p>Die Priorität lautet: automatisch ermittelte Werte (einschließlich aktivierter EXIF-Felder) → vererbbare Werte aus <code>&quot;.&quot;</code> → passender Dateieintrag in <code>gallery.json</code> → individuelle <code>dateiname.ext.json</code>-Sidecar-Datei.</p><h4>EXIF-Metadaten</h4><p>Das optionale Auslesen von EXIF-Daten ist standardmäßig deaktiviert. Wenn es aktiviert ist und die PHP-EXIF-Erweiterung verfügbar ist, können JPEG-Dateien Aufnahmedatum, Autor, Copyright, Kamera, Objektiv, Belichtungszeit, Blende, ISO und Brennweite liefern. Die ausgewählten Lightbox-Metadatenfelder legen fest, welche Werte angezeigt werden. JSON-Metadaten überschreiben entsprechende EXIF-Werte. GPS-EXIF-Bereiche werden bewusst weder gelesen noch angezeigt.</p><h4>Bildunterschriften</h4><p>Die bisherigen <code>dateiname.ext.txt</code>-Sidecars werden weiterhin unterstützt und haben für die im Raster/Slider sichtbare Beschriftung Vorrang. Eine leere <code>.txt</code> unterdrückt die Beschriftung. Beginnt die erste Zeile mit <code>!HTML</code>, bleibt der Modus für vertrauenswürdiges HTML erhalten. Ohne Text-Sidecar wird der JSON-<code>title</code> als Beschriftung verwendet; fehlt auch dieser, wird ein Titel aus dem Dateinamen erzeugt.</p><p>Die Metadatenanzeige der Lightbox ist unabhängig von den Beschriftungen im Galerie-Layout. Leere Werte werden automatisch ausgelassen; Bildabmessungen und Dateigröße werden bei Auswahl automatisch ermittelt.</p>"
