PLG_CONTENT_SIMPLEGALLERY="Content - Punga Simple Gallery"
PLG_CONTENT_SIMPLEGALLERY_XML_DESCRIPTION="<h3>Punga Simple Gallery</h3><p>Renders image and video galleries from folders below Joomla's <code>/images</code> directory.</p><h4>Placeholder syntax</h4><p><code>{simplegallery folder='path/to/gallery' [columns='4'] [width='240'] [height='180'] [showcaptions='true|false'] [layout='grid|slider'] [sort='filename|date|random'] [sortorder='ascending|descending'] [media='images|videos|both'] [lightbox='builtin|external|none'] [showmetadata='true|false']}</code></p><p><code>folder</code> is required. All other parameters override the corresponding plugin settings. The canonical parameter names are <code>folder</code>, <code>columns</code>, <code>width</code>, <code>height</code>, <code>showcaptions</code>, <code>layout</code>, <code>sort</code>, <code>sortorder</code>, <code>media</code>, <code>lightbox</code> and <code>showmetadata</code>. Parameter names are case-insensitive.</p><p>Alternative spellings accepted by the placeholder parser are <code>thumb_width</code> → <code>width</code>, <code>thumb_height</code> → <code>height</code>, <code>show_captions</code> → <code>showcaptions</code>, <code>sort_order</code> → <code>sortorder</code>, <code>media_types</code> → <code>media</code>, <code>lightbox_mode</code> → <code>lightbox</code>, and both <code>show_lightbox_metadata</code> and <code>show_metadata</code> → <code>showmetadata</code>.</p><h4>Images and videos</h4><p>Supported images: JPG/JPEG, PNG, GIF and WebP. Supported videos: MP4, M4V, WebM, OGV/OGG and MOV. The default media mode is images only. Set the plugin option to Videos or Images + Videos, or override one gallery with <code>media='videos'</code> or <code>media='both'</code>.</p><h4>Video posters</h4><p>A video's poster can be set with the JSON <code>poster</code> property. If no property is set, Punga Simple Gallery automatically looks for a same-folder sidecar named after the complete video filename, for example <code>garden.mp4.jpg</code>, <code>garden.mp4.png</code> or <code>garden.mp4.webp</code>. Poster files used by a video are not shown as separate gallery items. Without a poster, a neutral video tile is displayed.</p><h4>Built-in lightbox</h4><p>The built-in lightbox supports images and HTML5 video, previous/next navigation, arrow keys, Escape, touch/pointer swipes, focus trapping and adjacent-image preloading. In the plugin settings, Lightbox information can be placed beside the media, below it, or hidden completely. This placement is intentionally a plugin-wide presentation setting and has no placeholder parameter. <code>showmetadata='false'</code> only suppresses the metadata rows for one gallery; title and description remain available when Lightbox information is enabled.</p><h4>JSON metadata</h4><p>Metadata is optional. Put a <code>gallery.json</code> file in the gallery folder. The special <code>&quot;.&quot;</code> entry describes the folder/gallery; <code>author</code>, <code>copyright</code> and <code>location</code> from that entry are inherited by media items. Gallery <code>title</code> and <code>description</code> describe the gallery itself and are not inherited.</p><pre><code>{<br>  &quot;.&quot;: {<br>    &quot;title&quot;: &quot;Garden, September 2026&quot;,<br>    &quot;description&quot;: &quot;A few pictures and videos from the garden.&quot;,<br>    &quot;author&quot;: &quot;Example Author&quot;,<br>    &quot;copyright&quot;: &quot;© 2026 Example Author&quot;,<br>    &quot;location&quot;: &quot;Braunschweig&quot;<br>  },<br>  &quot;some_image.jpg&quot;: {<br>    &quot;title&quot;: &quot;The garden in September&quot;,<br>    &quot;description&quot;: &quot;Looking towards the old chestnut tree.&quot;,<br>    &quot;date&quot;: &quot;2026-09-18&quot;,<br>    &quot;alt&quot;: &quot;View through the garden towards the chestnut tree&quot;<br>  },<br>  &quot;garden_walk.mp4&quot;: {<br>    &quot;title&quot;: &quot;Walking through the garden&quot;,<br>    &quot;description&quot;: &quot;A short walk through the rear garden.&quot;,<br>    &quot;poster&quot;: &quot;garden_walk_poster.jpg&quot;<br>  }<br>}</code></pre><p>Supported JSON item properties are <code>title</code>, <code>description</code>, <code>date</code>, <code>author</code>, <code>location</code>, <code>copyright</code>, <code>alt</code>, <code>poster</code>, <code>camera</code>, <code>lens</code>, <code>exposure</code>, <code>aperture</code>, <code>iso</code> and <code>focal_length</code>. A file may additionally have an individual sidecar such as <code>some_image.jpg.json</code> or <code>garden_walk.mp4.json</code> containing the same item properties without a wrapper.</p><p>Metadata precedence is: automatically derived values (including enabled EXIF fields) → inheritable values from <code>&quot;.&quot;</code> → matching file entry in <code>gallery.json</code> → individual <code>filename.ext.json</code> sidecar.</p><h4>EXIF metadata</h4><p>Optional EXIF reading is disabled by default. When enabled and PHP's EXIF extension is available, JPEG files may provide capture date, author, copyright, camera, lens, exposure time, aperture, ISO and focal length. The selected Lightbox metadata fields determine which values are displayed. JSON metadata overrides matching EXIF values. GPS EXIF sections are deliberately not read or displayed.</p><h4>Captions</h4><p>Legacy <code>filename.ext.txt</code> caption sidecars remain supported and take priority for the caption shown in the grid/slider. An empty <code>.txt</code> suppresses that caption. Prefix a text sidecar with <code>!HTML</code> on the first line to retain the trusted-HTML mode. Without a text sidecar, the JSON <code>title</code> is used as the caption; otherwise a title is generated from the filename.</p><p>Lightbox metadata is independent from gallery captions. Empty metadata values are omitted automatically; image dimensions and file size are derived automatically when selected.</p>"
